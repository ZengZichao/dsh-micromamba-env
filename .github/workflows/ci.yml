name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check index.js
          node --check client.js

      - name: JSON manifests and locales
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"

      - name: Bundle patch parses as YAML
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('cordis.patch.yml','utf8');if(!s.includes('- insert:'))process.exit(1)"

      - name: Package file list
        run: npm pack --dry-run --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Icon is a valid SVG document
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('icon.svg','utf8');if(!/<svg[\s>]/.test(s))process.exit(1)"
